# Stress-test configuration (fair-budget comparison + classification fix)
# =======================================================================
# Differences from benchmark_config.yaml (which is left untouched):
#   * EQUAL SOLUTION BUDGET: every multi-solution method gets `n_solutions`
#     candidate solutions of `desired_sparsity` features each. The original
#     config handed GEMSS 6-12 solutions but ALFESE only 3, scoring the union --
#     a structural advantage. Here all methods get the same budget.
#   * NEW METHODS:
#       - GEMSS_logistic : GEMSS with a proper Bernoulli likelihood
#                          (the paper's stated classification model; the shipped
#                          core uses L2 even for classification).
#       - GEMSS_single   : single-Gaussian ablation (no mixture) -> one mode.
#       - Masking_*       : iterative-masking Lasso / ElasticNet / L1-logistic.
#       - StabilitySelection : Meinshausen-Buhlmann stable core (one solution).
#   * CLASSIFICATION vs REGRESSION pairs (exp 30+) to measure whether the
#     logistic fix actually changes support recovery.
#
# Ground truth in every experiment: 3 generating solutions x sparsity 5 = 15
# true features (disjoint, per the current generator). The honest/hard generator
# with OVERLAPPING supports + standardized variances is the planned next step.

output_dir: "results/"
experiment_name: "GEMSS_stresstest"

# --- reusable method blocks (top-level keys other than `experiments`,
#     `output_dir`, `experiment_name` are ignored by the runner) -------------
_anchors:
  gemss_baseline: &gemss_baseline
    lambda_jaccard: 1000
    batch_size: 16
    regularize: true
    n_iter: 3500
    prior: "sss"
    var_slab: 100.0
    var_spike: 0.1
    lr: 0.002
    student_df: 1
    student_scale: 1.0
    weight_slab: 0.9
    weight_spike: 0.1
  gemss_highdim: &gemss_highdim
    lambda_jaccard: 1000
    batch_size: 16
    regularize: true
    n_iter: 4500
    prior: "sss"
    var_slab: 100.0
    var_spike: 0.1
    lr: 0.002
    student_df: 1
    student_scale: 1.0
    weight_slab: 0.9
    weight_spike: 0.1
  gemss_adverse: &gemss_adverse
    lambda_jaccard: 500
    batch_size: 48
    regularize: true
    n_iter: 5000
    prior: "sss"
    var_slab: 100.0
    var_spike: 0.1
    lr: 0.002
    student_df: 1
    student_scale: 1.0
    weight_slab: 0.9
    weight_spike: 0.1
  baselines_clf: &baselines_clf
    Masking_lasso: {estimator: "lasso", alpha: 0.01}
    Masking_elasticnet: {estimator: "elasticnet", alpha: 0.01}
    Masking_logistic: {estimator: "logistic", alpha: 0.05}
    StabilitySelection: {alpha: 0.05, n_bootstrap: 100, threshold: 0.6}
    ALFESE_mi_tau1.0: {selector_type: "mi", tau: 1.0}
    ALFESE_greedy_tau1.0: {selector_type: "greedy", tau: 1.0}
    ALFESE_importance_tau1.0: {selector_type: "importance", tau: 1.0}
  baselines_reg: &baselines_reg
    Masking_lasso: {estimator: "lasso", alpha: 0.01}
    Masking_elasticnet: {estimator: "elasticnet", alpha: 0.01}
    StabilitySelection: {alpha: 0.02, n_bootstrap: 100, threshold: 0.6}
    ALFESE_mi_tau1.0: {selector_type: "mi", tau: 1.0}
    ALFESE_greedy_tau1.0: {selector_type: "greedy", tau: 1.0}
    ALFESE_importance_tau1.0: {selector_type: "importance", tau: 1.0}

experiments:
  # ===== Baseline / dimensionality (classification) =====================
  - id: "st_clf_50x100"
    exp_number: 1
    description: "Stress: clf baseline N=50 P=100"
    dataset: {n_samples: 50, n_features: 100, n_generating_solutions: 3, sparsity: 5, noise_std: 0.1, nan_ratio: 0.0, binarize: true, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_baseline
      GEMSS_logistic: *gemss_baseline
      GEMSS_single: *gemss_baseline
      <<: *baselines_clf

  - id: "st_clf_50x200"
    exp_number: 2
    description: "Stress: clf baseline N=50 P=200"
    dataset: {n_samples: 50, n_features: 200, n_generating_solutions: 3, sparsity: 5, noise_std: 0.1, nan_ratio: 0.0, binarize: true, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_baseline
      GEMSS_logistic: *gemss_baseline
      GEMSS_single: *gemss_baseline
      <<: *baselines_clf

  - id: "st_clf_50x500"
    exp_number: 3
    description: "Stress: clf high-dim transition N=50 P=500"
    dataset: {n_samples: 50, n_features: 500, n_generating_solutions: 3, sparsity: 5, noise_std: 0.1, nan_ratio: 0.0, binarize: true, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_highdim
      GEMSS_logistic: *gemss_highdim
      GEMSS_single: *gemss_highdim
      <<: *baselines_clf

  - id: "st_clf_100x500"
    exp_number: 4
    description: "Stress: clf baseline medium N=100 P=500"
    dataset: {n_samples: 100, n_features: 500, n_generating_solutions: 3, sparsity: 5, noise_std: 0.1, nan_ratio: 0.0, binarize: true, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_highdim
      GEMSS_logistic: *gemss_highdim
      GEMSS_single: *gemss_highdim
      <<: *baselines_clf

  # ===== High-dimensional stress (classification) =======================
  - id: "st_clf_50x1000"
    exp_number: 5
    description: "Stress: clf ultra-sparse N=50 P=1000"
    dataset: {n_samples: 50, n_features: 1000, n_generating_solutions: 3, sparsity: 5, noise_std: 0.1, nan_ratio: 0.0, binarize: true, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_highdim
      GEMSS_logistic: *gemss_highdim
      GEMSS_single: *gemss_highdim
      <<: *baselines_clf

  - id: "st_clf_100x2000"
    exp_number: 6
    description: "Stress: clf ultra-sparse N=100 P=2000"
    dataset: {n_samples: 100, n_features: 2000, n_generating_solutions: 3, sparsity: 5, noise_std: 0.1, nan_ratio: 0.0, binarize: true, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_highdim
      GEMSS_logistic: *gemss_highdim
      GEMSS_single: *gemss_highdim
      <<: *baselines_clf

  # ===== Adversity (classification) =====================================
  - id: "st_clf_100x200_noise0.5"
    exp_number: 7
    description: "Stress: clf high noise N=100 P=200 sigma=0.5"
    dataset: {n_samples: 100, n_features: 200, n_generating_solutions: 3, sparsity: 5, noise_std: 0.5, nan_ratio: 0.0, binarize: true, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_adverse
      GEMSS_logistic: *gemss_adverse
      GEMSS_single: *gemss_adverse
      <<: *baselines_clf

  - id: "st_clf_100x200_nan0.2"
    exp_number: 8
    description: "Stress: clf missing data N=100 P=200 nan=0.2"
    dataset: {n_samples: 100, n_features: 200, n_generating_solutions: 3, sparsity: 5, noise_std: 0.1, nan_ratio: 0.2, binarize: true, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_adverse
      GEMSS_logistic: *gemss_adverse
      GEMSS_single: *gemss_adverse
      <<: *baselines_clf

  - id: "st_clf_100x200_noise0.5_nan0.2"
    exp_number: 9
    description: "Stress: clf noise+missing N=100 P=200"
    dataset: {n_samples: 100, n_features: 200, n_generating_solutions: 3, sparsity: 5, noise_std: 0.5, nan_ratio: 0.2, binarize: true, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_adverse
      GEMSS_logistic: *gemss_adverse
      GEMSS_single: *gemss_adverse
      <<: *baselines_clf

  # ===== Class imbalance (classification) ===============================
  - id: "st_clf_200x500_imb0.2"
    exp_number: 10
    description: "Stress: clf imbalance N=200 P=500 minority=0.2"
    dataset: {n_samples: 200, n_features: 500, n_generating_solutions: 3, sparsity: 5, noise_std: 0.1, nan_ratio: 0.0, binarize: true, binary_response_ratio: 0.2, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_adverse
      GEMSS_logistic: *gemss_adverse
      GEMSS_single: *gemss_adverse
      <<: *baselines_clf

  # ===== Regression mirrors (logistic-vs-L2 story) ======================
  - id: "st_reg_50x200"
    exp_number: 11
    description: "Stress: reg baseline N=50 P=200"
    dataset: {n_samples: 50, n_features: 200, n_generating_solutions: 3, sparsity: 5, noise_std: 0.1, nan_ratio: 0.0, binarize: false, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
    desired_sparsity: 5
    methods:
      GEMSS: *gemss_baseline
      GEMSS_single: *gemss_baseline
      <<: *baselines_reg

  - id: "st_reg_100x500"
    exp_number: 12
    description: "Stress: reg baseline N=100 P=500"
    dataset: {n_samples: 100, n_features: 500, n_generating_solutions: 3, sparsity: 5, noise_std: 0.1, nan_ratio: 0.0, binarize: false, binary_response_ratio: 0.5, seed: 42}
    n_solutions: 6
