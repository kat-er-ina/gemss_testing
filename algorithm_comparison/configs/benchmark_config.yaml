# Benchmark Configuration
# Single unified configuration file for all experiments

output_dir: "results/"
experiment_name: "GEMSS_benchmark"

# List of all experiments
# Each experiment is self-contained with dataset parameters and method configurations
experiments:
  # ========================================
  # TIER 1: Basic validation
  # Baseline performance on clean data (Noise=0.1, NaN=0.0)
  # ========================================
  
  - id: "tier1_30x100_s5"
    exp_number: 1
    description: "Tier 1: Basic validation - N=30, P=100"
    dataset:
      n_samples: 30
      n_features: 100
      n_generating_solutions: 3
      sparsity: 5
      noise_std: 0.1
      nan_ratio: 0.0
      binarize: true
      binary_response_ratio: 0.5
      seed: 42
    gemss_n_solutions: 6
    alfese_n_solutions: 3
    desired_sparsity: 5
    methods:
      GEMSS:
        lambda_jaccard: 1000
        batch_size: 16
        regularize: true
        n_iter: 3500
        prior: "sss"
        var_slab: 100.0
        var_spike: 0.1
        lr: 0.002
        student_df: 1
        student_scale: 1.0
        weight_slab: 0.9
        weight_spike: 0.1
      ALFESE_mrmr_tau1.0:
        selector_type: "mrmr"
        tau: 1.0
      ALFESE_mi_tau1.0:
        selector_type: "mi"
        tau: 1.0
      ALFESE_fcbf_tau1.0:
        selector_type: "fcbf"
        tau: 1.0
      ALFESE_greedy_tau1.0:
        selector_type: "greedy"
        tau: 1.0
      ALFESE_importance_tau1.0:
        selector_type: "importance"
        tau: 1.0

