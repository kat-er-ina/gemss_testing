[project]
name = "gemss-benchmarking"
version = "0.1.0"
description = "Benchmarking suite for GEMSS and alternative feature selection methods"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alfese>=1.0.0",
    "gemss>=1.1.0",
    "ipython>=9.10.0",
    "metabolights-utils>=1.4.18",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.0",
    "ruff>=0.15.2",
    "scikit-learn>=1.3.0",
    "tqdm>=4.67.3",
]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"