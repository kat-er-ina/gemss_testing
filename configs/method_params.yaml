# Method-specific hyperparameters
# Configuration for algorithm-specific parameters

# Hyperparameters for all competitive methods

GEMSS:
  # Parameters taken from gemss/config/algorithm_settings.json
  n_components: 6          # Matched to 'N_CANDIDATE_SOLUTIONS' logic (roughly)
  #prior: "sss"              # Spike-and-Slab Student-t
  #sss_sparsity: 4
  #learning_rate: 0.002
  #n_iter: 3500
  #batch_size: 20
  #lambda_jaccard: 500       # Diversity penalty
  #sample_more_priors_coeff: 1
  #is_regularized: true
  #student_df: 1
  #student_scale: 1
  #var_slab: 100
  #var_spike: 0.1
  #weight_slab: 0.9
  #weight_spike: 0.1

ALFESE:
  n_solutions: 6           # Should match GEMSS n_components for fair comparison
  q: 0.1                    # FDR control parameter
  max_iter: 100             # Max iterations for the genetic/knockoff search
  knockoff_type: "gaussian" # Type of knockoffs to generate

LASSO:
  cv: 5                     # Number of cross-validation folds
  n_alphas: 100             # Granularity of the regularization path
  random_state: 42

BLASSO:
  # Bayesian Ridge / LASSO Wrapper settings
  threshold_std: 2.0        # Credible interval threshold (approx 95%)
  n_iter: 300               # MCMC iterations (if using sampling) or max_iter
  tol: 0.001
  compute_score: true       # To monitor convergence
